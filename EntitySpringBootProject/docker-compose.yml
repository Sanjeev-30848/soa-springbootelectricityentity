version: '3.8'

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: soatasktb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    image: sanjeev30848/docker-electricity-entity-backend:latest
    container_name: docker-springboot
    ports:
      - "2027:2027"
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net: